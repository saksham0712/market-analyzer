[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyzer"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
install = "pip install -r requirements.txt"
